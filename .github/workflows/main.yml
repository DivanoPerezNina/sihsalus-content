name: Build with Maven

on:
  push:
    branches: [ main, pre-release ]
  pull_request:
    branches: [ main, pre-release ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission-migration:
    uses: ./.github/workflows/admission-role-reconciliation.yml

  admission-initializer:
    uses: ./.github/workflows/admission-initializer.yml

  reference-range-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Evaluate shipped maternal ranges with native Core authorization
        run: mvn --batch-mode --no-transfer-progress --file .github/integration/reference-range-access/pom.xml test

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Validate AMPATH forms
        run: python3 .github/scripts/validate_ampath_forms.py
      - name: Test AMPATH form identity validation
        run: python3 .github/scripts/test_ampath_forms.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test clinical form expressions
        run: |
          npm ci --prefix .github/integration/form-expressions --ignore-scripts
          npm test --prefix .github/integration/form-expressions
          TZ=America/New_York npm test --prefix .github/integration/form-expressions
      - name: Validate CE-001 diagnosis contract
        run: python3 .github/scripts/validate_ce001_diagnosis_contract.py
      - name: Test CE-001 diagnosis contract validator
        run: python3 .github/scripts/test_ce001_diagnosis_contract.py
      - name: Validate social history contract
        run: python3 .github/scripts/validate_social_history_contract.py
      - name: Test social history contract
        run: python3 .github/scripts/test_social_history_contract.py
      - name: Validate Consulta Externa physical examination contract
        run: python3 .github/scripts/validate_ce_physical_exam_contract.py
      - name: Test Consulta Externa physical examination contract
        run: python3 .github/scripts/test_ce_physical_exam_contract.py
      - name: Test simplified Consulta Externa forms
        run: python3 .github/scripts/test_consulta_externa_forms.py
      - name: Validate Visit Note content contract
        run: python3 .github/scripts/validate_visit_note_content_contract.py
      - name: Test Visit Note content contract validator
        run: python3 .github/scripts/test_visit_note_content_contract.py
      - name: Validate CSV widths
        run: python3 .github/scripts/validate_csv_widths.py
      - name: Test CSV role contract validator
        run: python3 .github/scripts/test_csv_widths.py
      - name: Validate hospital functional access profiles
        run: python3 .github/scripts/validate_hospital_access_profiles.py
      - name: Test hospital access drift safeguards
        run: python3 .github/scripts/test_hospital_access_profiles.py
      - name: Validate Hospital Santa Clotilde institutional metadata
        run: python3 .github/scripts/validate_hospital_institution_metadata.py
      - name: Test Hospital Santa Clotilde institutional metadata validator
        run: python3 .github/scripts/test_hospital_institution_metadata.py
      - name: Validate Liquibase changelogs
        run: python3 .github/scripts/validate_liquibase.py
      - name: Test admission role reconciliation
        run: python3 .github/scripts/test_admission_role_reconciliation.py
      - name: Validate appointment visit queue integrity
        run: python3 .github/scripts/validate_appointment_queue_integrity.py
      - name: Validate Stock Management foundation
        run: python3 .github/scripts/validate_stock_foundation.py
      - name: Validate OCL exports
        run: python3 .github/scripts/validate_ocl_exports.py
      - name: Test CRED birth and anemia capture contracts
        run: python3 .github/scripts/test_cred_birth_context.py
      - name: Test laboratory capture compatibility
        run: python3 .github/scripts/test_laboratory_capture_validation.py
      - name: Test reproducible OCL export exclusions
        run: python3 .github/scripts/test_split_ocl_export.py
      - name: Test neighborhood catalog validator
        run: python3 .github/scripts/test_neighborhood_catalog_validation.py
      - name: Test referral transport catalog validator
        run: python3 .github/scripts/test_referral_transport_catalog_validation.py
      - name: Test procedure anatomy catalog validator
        run: python3 .github/scripts/test_procedure_anatomy_catalog_validation.py
      - name: Validate reference ranges
        run: bash .github/scripts/validate_reference_ranges.sh
      - name: Test reference range compatibility
        run: bash .github/scripts/test_reference_ranges.sh
      - name: Validate chart vitals encounter contract
        run: python3 .github/scripts/validate_chart_vitals_contract.py
      - name: Validate form/concept terminology integrity
        run: python3 .github/scripts/validate_form_concept_integrity.py
      - name: Test form/concept integrity validator
        run: bash .github/scripts/test_form_concept_integrity.sh
      - name: Test SIHSALUS validation log classifier
        run: bash .github/scripts/test_classify_validation_log.sh
      - name: Test Maven Central publication gate
        run: bash .github/scripts/test_maven_central_publication.sh --bundle
      - name: Build with Maven
        id: build_with_maven
        run: |
          ./mvnw --show-version clean verify --batch-mode --file pom.xml

  publish:
    needs: [build, admission-migration, admission-initializer, reference-range-access]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pre-release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Check Maven Central version
        id: central-version
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout --file pom.xml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          URL="https://repo1.maven.org/maven2/io/github/proyecto-santaclotilde/sihsalus-content/${VERSION}/sihsalus-content-${VERSION}.pom"
          for attempt in $(seq 1 6); do
            if curl -fsI "$URL" >/dev/null; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Version ${VERSION} already exists in Maven Central; skipping publish."
              exit 0
            fi
            echo "Version ${VERSION} is not visible in Maven Central yet; check ${attempt}/6."
            sleep 20
          done
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION} is not in Maven Central; publishing."

      - name: Set up Maven Central credentials
        if: steps.central-version.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Deploy to Maven Central
        if: steps.central-version.outputs.exists == 'false'
        run: ./mvnw --show-version -B -P release clean deploy --file pom.xml
        env:
          JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify Maven Central publication
        run: bash .github/scripts/wait_for_maven_central.sh "${{ steps.central-version.outputs.version }}"

  validate-with-sihsalus:
    needs: publish
    uses: ./.github/workflows/validate-with-sihsalus.yml
